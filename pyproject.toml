[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "govfix"
version = "0.1.0"
description = "Policy-governed municipal grievance workflow"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "pwdlib[argon2]>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "pillow>=12,<13",
  "supabase>=2.0,<3",
  "httpx>=0.27,<1",
  "elevenlabs>=2.71.0",
]

[project.scripts]
govfix = "govfix.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "playwright>=1.55,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
