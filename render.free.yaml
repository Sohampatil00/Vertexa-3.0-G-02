# Free demo: web/API on Render, worker runs separately on your local machine.
services:
  - type: web
    name: govfix-web-free
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/render_start.py web
    autoDeployTrigger: "off"
    healthCheckPath: /ready
    envVars:
      - key: GOVFIX_DATABASE_URL
        sync: false
      - key: GOVFIX_LOGIN_RATE_SECRET
        generateValue: true
      - key: GOVFIX_REQUIRE_RESTRICTED_ROLE
        value: "true"
      - key: GOVFIX_POLICY_VERSION
        value: demo-pilot-v1
      - key: GOVFIX_READINESS_TIMEOUT_MS
        value: "2000"
      - key: GOVFIX_LOGIN_IP_LIMIT
        value: "300"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: evidence
      - key: GOVFIX_AUTH_PROVIDER
        value: local
